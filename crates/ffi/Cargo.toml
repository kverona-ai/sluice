[package]
name = "sluice-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UniFFI export surface of the Sluice core for the iOS / Android shells (02 §5.5): SluiceSession, RepoView, ReviewQueue, EventSink."

[lib]
name = "sluice_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
sluice-core.workspace = true
sluice-backend-gix.workspace = true
sluice-sync.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uniffi = { version = "0.29", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
