[package]
name = "sluice"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Sluice — the IDEA-grade Git workbench for AI coding agents (desktop app + `sluice` CLI)"
default-run = "sluice"

[[bin]]
name = "sluice"
path = "src/main.rs"

[dependencies]
sluice-core.workspace = true
sluice-backend-gix.workspace = true
sluice-graph.workspace = true
sluice-domain.workspace = true
sluice-ui.workspace = true
sluice-bridge.workspace = true
serde_json.workspace = true
sluice-backend-cli.workspace = true
sluice-sync.workspace = true
async-channel.workspace = true
gpui.workspace = true
gpui-component.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
png = "0.17"
