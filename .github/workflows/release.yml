name: Release

# Builds the desktop app for macOS (arm64 + x86_64) and Windows (x86_64), packages
# them (unsigned until the signing accounts exist — 04 §4 / 05 §9.4), and attaches
# the archives + SHA256SUMS to the GitHub Release for tags `v*`. `workflow_dispatch`
# produces the same artifacts without publishing (dry run).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release -p sluice --target ${{ matrix.target }}
      - name: Version
        id: ver
        shell: bash
        run: |
          V="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Package (macOS .app → zip)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/sluice" target/release/sluice
          scripts/bundle-macos.sh release
          mkdir -p dist
          ditto -c -k --keepParent target/release/Sluice.app "dist/sluice-${{ steps.ver.outputs.version }}-${{ matrix.name }}.zip"
          (cd dist && shasum -a 256 *.zip > "SHA256SUMS-${{ matrix.name }}.txt")
      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/sluice.exe", "LICENSE", "README.md" -DestinationPath "dist/sluice-$v-${{ matrix.name }}.zip" -Force
          $h = (Get-FileHash "dist/sluice-$v-${{ matrix.name }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  sluice-$v-${{ matrix.name }}.zip" | Out-File -Encoding ascii "dist/SHA256SUMS-${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Merge checksums
        run: |
          cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS
          rm dist/SHA256SUMS-*.txt
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Unsigned preview builds (macOS Gatekeeper / Windows SmartScreen will warn —
            right-click → Open on macOS, "More info → Run anyway" on Windows). Signing and
            notarization arrive with the first public beta. Verify downloads with SHA256SUMS.
